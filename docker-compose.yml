services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
  server:
    build: ./server
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/agriconnect
      JWT_SECRET: change-me
      ML_SERVICE_URL: http://ml-service:8000
    ports: ["5000:5000"]
    depends_on: [mongodb, ml-service]
  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]
  client:
    build: ./client
    ports: ["5173:5173"]
    depends_on: [server]
volumes:
  mongo_data:
